services:
  - type: web
    name: traffic-intelligence-backend
    runtime: python
    plan: free

    buildCommand: |
      apt-get update
      apt-get install -y ffmpeg
      pip install -r backend/requirements.txt

    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9